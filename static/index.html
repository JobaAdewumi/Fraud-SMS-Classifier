<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Scam Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configure Tailwind to use manual class-based dark mode
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        /* Smooth transition for the whole page */
        body { transition: background-color 0.3s ease, color 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen p-4 sm:p-8 flex justify-center items-start">
    
    <div class="max-w-xl w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 p-6 sm:p-8 mt-10 transition-colors duration-300">
        
        <!-- Header with Dark Mode Toggle -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                SMS Scam Detector 🇳🇬
            </h1>
            <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-gray-600 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" title="Toggle Dark Mode">
                <!-- Sun/Moon Icon SVG -->
                <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>
        
        <!-- Input Area -->
        <textarea id="messageInput" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-xl p-4 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 transition-colors" rows="4" placeholder="Paste SMS message here... (e.g., 'You have won 50,000 Naira')"></textarea>
        
        <button id="analyzeBtn" onclick="analyzeMessage()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition-colors flex justify-center items-center gap-2 shadow-sm disabled:opacity-75 disabled:cursor-not-allowed">
            <span id="btnText">Analyze Message</span>
            <!-- Loading Spinner (Hidden by default) -->
            <svg id="loadingSpinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>

        <!-- Results Section -->
        <div id="results" class="mt-8 hidden animate-fade-in">
            <h2 class="text-lg font-semibold border-b border-gray-200 dark:border-gray-700 pb-2 mb-4 text-gray-800 dark:text-gray-200">Analysis Results</h2>
            
            <div class="flex justify-between items-center mb-5">
                <span class="text-gray-600 dark:text-gray-400 font-medium">Verdict:</span>
                <span id="verdictLabel" class="px-4 py-1.5 rounded-full text-sm font-bold shadow-sm tracking-wide"></span>
            </div>
            
            <div class="mb-6 bg-gray-50 dark:bg-gray-750/50 p-4 rounded-xl border border-gray-200 dark:border-gray-700">
                <span class="text-gray-700 dark:text-gray-300 text-sm font-semibold">Model Probabilities:</span>
                <div class="flex justify-between text-sm mt-3">
                    <span class="text-green-700 dark:text-green-400 font-medium">Safe: <span id="safeProb"></span>%</span>
                    <span class="text-red-700 dark:text-red-400 font-medium">Fraud: <span id="fraudProb"></span>%</span>
                </div>
            </div>

            <div class="border-t border-gray-200 dark:border-gray-700 pt-5">
                <span class="text-gray-700 dark:text-gray-300 text-sm font-semibold">Keyword Insights (Fraud Weight):</span>
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-3 mt-1">Words that pushed the model toward a "Fraudulent" prediction.</p>
                <div id="keywordTags" class="flex flex-wrap gap-2 mt-2"></div>
            </div>
        </div>

       <div class="mt-10 pt-6 border-t border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4">
    
    <!-- Built By Joba with Clickable Name & Logo -->
    <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500 dark:text-gray-400 font-medium">
            Built by 
            <a href="https://jobaadewumi.com" target="_blank" rel="noopener noreferrer" class="text-gray-800 dark:text-gray-200 font-bold hover:underline focus:outline-none focus:ring-1 focus:ring-blue-500 rounded">
                Joba Adewumi
            </a>
        </span>
        <a href="https://jobaadewumi.com" target="_blank" rel="noopener noreferrer" class="inline-block transition-transform hover:scale-105 focus:outline-none">
            <img src="logo-white.png" alt="Joba Adewumi Logo" class="h-6 object-contain grayscale hover:grayscale-0 dark:opacity-80 transition-all duration-300">
        </a>
    </div>

    <!-- GitHub Repository Link -->
    <a href="https://github.com/JobaAdewumi/Fraud-SMS-Classifier" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors flex items-center gap-2 text-sm font-medium">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
        </svg>
        View Source
    </a>
</div>

    </div>

    <script>
        // 1. Dark Mode Logic
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        
        // Check for saved theme or system preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
            setSunIcon();
        } else {
            setMoonIcon();
        }

        function toggleDarkMode() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
                setMoonIcon();
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
                setSunIcon();
            }
        }

        function setSunIcon() {
            themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />`;
        }

        function setMoonIcon() {
            themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
        }

        // 2. API Call Logic
        async function analyzeMessage() {
            const text = document.getElementById('messageInput').value;
            if (!text) return alert("Please enter a message to analyze.");

            // UI Loading State
            const btn = document.getElementById('analyzeBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');
            const resultsDiv = document.getElementById('results');
            
            btn.disabled = true;
            btnText.innerText = "Analyzing...";
            spinner.classList.remove('hidden');
            resultsDiv.classList.add('hidden'); // Hide old results

            try {
                // Call the FastAPI Endpoint
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                
                // Populate Verdict
                const badge = document.getElementById('verdictLabel');
                badge.innerText = data.label;
                badge.className = `px-4 py-1.5 rounded-full text-sm font-bold shadow-sm tracking-wide ${
                    data.label === 'Fraudulent' 
                    ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800' 
                    : 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 border border-green-200 dark:border-green-800'
                }`;
                
                // Populate Metrics
                document.getElementById('safeProb').innerText = data.safe_probability;
                document.getElementById('fraudProb').innerText = data.fraud_probability;

                // Render Keyword Tags based on positive weights
                const tagsContainer = document.getElementById('keywordTags');
                tagsContainer.innerHTML = '';
                
                let hasFraudKeywords = false;
                for (const [word, weight] of Object.entries(data.keyword_insights)) {
                    if (weight > 0.1) { // Filter out negligible weights
                        hasFraudKeywords = true;
                        const tag = document.createElement('span');
                        tag.className = 'px-2.5 py-1 bg-yellow-100 dark:bg-yellow-900/40 text-yellow-800 dark:text-yellow-300 text-xs rounded-lg border border-yellow-300 dark:border-yellow-700/50 shadow-sm font-medium';
                        tag.innerText = `${word} (${weight.toFixed(2)})`;
                        tagsContainer.appendChild(tag);
                    }
                }
                
                if (!hasFraudKeywords) {
                     tagsContainer.innerHTML = '<span class="text-sm text-gray-400 dark:text-gray-500 italic">No strong fraud keywords detected.</span>';
                }

                // Show Results
                resultsDiv.classList.remove('hidden');

            } catch (error) {
                alert("Error connecting to the backend. Is FastAPI running?");
                console.error(error);
            } finally {
                // Restore UI State
                btn.disabled = false;
                btnText.innerText = "Analyze Message";
                spinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
